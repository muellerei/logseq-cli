<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="logseq-cli: lets an AI agent write into a Logseq graph without breaking it">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/></linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity="0.06"/></pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    </style>
  </defs>
  <rect width="1280" height="640" rx="0" fill="url(#bg)"/>
  <rect width="1280" height="640" rx="0" fill="url(#dots)"/>
  <rect x="160" y="56" width="960" height="244" rx="18" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="194" y="110" class="mono" font-size="22" font-weight="700" fill="#8b949e">## Log</text>
  <line x1="194" y1="127" x2="1093" y2="127" stroke="#30363d" stroke-width="2"/>
  <circle cx="199" cy="154" r="4.6" fill="#8b949e"/>
  <text x="222" y="160" class="mono" font-size="22" fill="#e6edf3">Call with Alex about the contract</text>
  <rect x="658" y="137" width="2.9" height="30" fill="#e6edf3"/>
  <text x="1084" y="159" class="mono" font-size="20" font-weight="700" text-anchor="end" fill="#f85149">✕ refused</text>
  <circle cx="199" cy="204" r="4.6" fill="#2ec4b6"/>
  <text x="222" y="210" class="mono" font-size="22" fill="#e6edf3"><tspan font-weight="700">14:31</tspan> Decided to ship on Friday</text>
  <text x="1084" y="209" class="mono" font-size="20" font-weight="700" text-anchor="end" fill="#2ec4b6">✓ written</text>
  <text x="222" y="259" class="mono" font-size="17" fill="#8b949e">confirmed with Logseq · the block you type in stays yours</text>
  <text x="640" y="418" text-anchor="middle" class="mono" font-size="96" font-weight="700" fill="#e6edf3" letter-spacing="-2">logseq<tspan fill="#2ec4b6">-</tspan>cli</text>
  <text x="640" y="484" text-anchor="middle" class="sans" font-size="36" fill="#c9d1d9">Your agent writes into Logseq</text>
  <text x="640" y="536" text-anchor="middle" class="sans" font-size="26" fill="#8b949e">without breaking your graph · every write verified</text>
</svg>
