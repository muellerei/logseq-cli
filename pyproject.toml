[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logseq-cli"
version = "0.14.0"
description = "CLI for Logseq knowledge graph — pages, journals, blocks, search, properties, and graph analysis"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "requests>=2.28",
    # tomllib is in the standard library from 3.11; 3.10 needs the backport,
    # otherwise reading a config file fails on the oldest supported version.
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/muellerei/logseq-cli"
Changelog = "https://github.com/muellerei/logseq-cli/blob/main/CHANGELOG.md"
Issues = "https://github.com/muellerei/logseq-cli/issues"

[project.scripts]
logseq-cli = "logseq_cli.cli:cli"

[tool.setuptools]
packages = ["logseq_cli", "logseq_cli.commands"]
