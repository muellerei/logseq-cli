[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logseq-cli"
version = "0.4.0"
description = "CLI for Logseq knowledge graph — pages, journals, blocks, search, properties, and graph analysis"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "requests>=2.28",
]

[project.scripts]
logseq-cli = "logseq_cli.cli:cli"
